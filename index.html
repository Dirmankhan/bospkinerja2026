function mkIcon(paths, viewBox) {
  return function Icon({ size = 16, color = "currentColor", style, ...rest }) {
    return React.createElement(
      "svg",
      { width: size, height: size, viewBox: viewBox || "0 0 24 24", fill: "none", stroke: color,
        strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style, ...rest },
      paths.map((d, i) => React.createElement("path", { d, key: i }))
    );
  };
}

const JENJANG_COLORS = {

  SLB: "#7a5c8e", SMA: "#3d6b8a", SMK: "#a8542f", SMP: "#4a7c6f"

}

/* ---- Grafik SVG sederhana (tanpa library luar, supaya tak bergantung CDN chart) ---- */
function SimpleBarChart({ data, activeKab, onBarClick }) {
  const w = 560, h = 260, padL = 34, padB = 66, padT = 10, padR = 8;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(1, ...data.map(d => d.total));
  const barGap = 10;
  const barW = data.length ? Math.max(8, innerW / data.length - barGap) : 0;
  const yTicks = 4;
  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" style={{overflow:"visible"}}>
      {Array.from({length: yTicks+1}).map((_, i) => {
        const y = padT + innerH - (i/yTicks)*innerH;
        const val = Math.round((max/yTicks)*i);
        return (
          <g key={i}>
            <line x1={padL} x2={w-padR} y1={y} y2={y} stroke={LINE} strokeDasharray="2 4" />
            <text x={padL-6} y={y+3} fontSize={10} fill="#6b6154" textAnchor="end">{val}</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const barH = (d.total/max) * innerH;
        const x = padL + i*(innerW/data.length) + ((innerW/data.length)-barW)/2;
        const y = padT + innerH - barH;
        const isActive = d.full === activeKab;
        return (
          <g key={i} style={{cursor:"pointer"}} onClick={()=>onBarClick(d.full)}>
            <rect x={x} y={y} width={barW} height={Math.max(barH,1)} rx={5} fill={isActive ? RUST : "#d9c9ae"}>
              <title>{d.kab}: {d.total}</title>
            </rect>
            <text x={x+barW/2} y={padT+innerH+14} fontSize={9.5} fill="#6b6154" textAnchor="end"
              transform={"rotate(-28 " + (x+barW/2) + " " + (padT+innerH+14) + ")"}>{d.kab}</text>
          </g>
        );
      })}
    </svg>
  );
}

function SimplePieChart({ data }) {
  const size = 220, cx = size/2, cy = size/2, rOuter = 82, rInner = 48;
  const total = data.reduce((s,d)=>s+d.value, 0) || 1;
  let angle = -90;
  const arcs = data.map(d => {
    const sweep = (d.value/total) * 360;
    const start = angle;
    const end = angle + sweep;
    angle = end;
    const toXY = (r, a) => {
      const rad = (a * Math.PI) / 180;
      return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
    };
    const [x1,y1] = toXY(rOuter, start);
    const [x2,y2] = toXY(rOuter, end);
    const [x3,y3] = toXY(rInner, end);
    const [x4,y4] = toXY(rInner, start);
    const large = sweep > 180 ? 1 : 0;
    const path = [
      "M", x1, y1,
      "A", rOuter, rOuter, 0, large, 1, x2, y2,
      "L", x3, y3,
      "A", rInner, rInner, 0, large, 0, x4, y4,
      "Z"
    ].join(" ");
    return { path, name: d.name, value: d.value, color: JENJANG_COLORS[d.name] || "#ccc" };
  });
  return (
    <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:14}}>
      <svg viewBox={"0 0 " + size + " " + size} width={size} height={size}>
        {arcs.map((a,i) => (
          <path key={i} d={a.path} fill={a.color}>
            <title>{a.name}: {a.value}</title>
          </path>
        ))}
      </svg>
      <div style={{display:"flex", flexWrap:"wrap", justifyContent:"center", gap:"6px 14px"}}>
        {arcs.map((a,i) => (
          <div key={i} style={{display:"flex", alignItems:"center", gap:5, fontSize:11, color:"#6b6154"}}>
            <span style={{width:9, height:9, borderRadius:2, background:a.color, display:"inline-block"}}></span>
            {a.name} ({a.value})
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- PAGE 1: SEBARAN GUGUS ---------------- */
function MultiSelect({ options, selected, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const label = selected.length === 0 ? placeholder : (selected.length === 1 ? selected[0] : selected.length + " dipilih");
  const toggle = (opt) => {
    if (selected.includes(opt)) onChange(selected.filter(x=>x!==opt));
    else onChange([...selected, opt]);
  };
  return (
    <div style={{position:"relative"}}>
      <button type="button" onClick={()=>setOpen(o=>!o)}
        style={{...selectStyle, textAlign:"left", display:"flex", alignItems:"center", justifyContent:"space-between", cursor:"pointer"}}>
        <span style={{color: selected.length===0 ? "#8a7f6e" : INK}}>{label}</span>
        <ChevronDown size={14} color="#9b8f7c" />
      </button>
      {open && (
        <>
          <div onClick={()=>setOpen(false)} style={{position:"fixed", inset:0, zIndex:10}} />
          <div style={{position:"absolute", top:"calc(100% + 4px)", left:0, right:0, background:"#fff", border:"1px solid " + LINE, borderRadius:8, boxShadow:"0 8px 24px rgba(0,0,0,0.08)", zIndex:11, padding:6, maxHeight:220, overflowY:"auto"}}>
            {selected.length > 0 && (
              <div onClick={()=>onChange([])} style={{padding:"6px 8px", fontSize:11.5, color: RUST, cursor:"pointer", fontWeight:600}}>Bersihkan pilihan</div>
            )}
            {options.map(opt => (
              <label key={opt} style={{display:"flex", alignItems:"center", gap:8, padding:"6px 8px", fontSize:12.5, color: INK, cursor:"pointer", borderRadius:6}}
                onMouseDown={e=>e.preventDefault()}>
                <input type="checkbox" checked={selected.includes(opt)} onChange={()=>toggle(opt)} style={{cursor:"pointer"}} />
                {opt}
              </label>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function Page1() {
  const kabList = Object.keys(DATA.kab).sort();
  const [activeKab, setActiveKab] = useState("Semua Kabupaten/Kota");
  const [activeJenjangs, setActiveJenjangs] = useState([]);
  const [activeGelombangs, setActiveGelombangs] = useState([]);
  const [query, setQuery] = useState("");

  const kabTotals = useMemo(() => {
    return kabList.map(k => {
      const gugusList = DATA.kab[k];
      const total = gugusList.reduce((s,g)=>s+g.t,0);
      const gugusCount = gugusList.length;
      return { kab: k.replace("Kabupaten ","Kab. "), full: k, total, gugusCount };
    });
  }, [kabList]);

  const grandTotalSchools = kabTotals.reduce((s,k)=>s+k.total,0);
  const grandTotalGugus = kabTotals.reduce((s,k)=>s+k.gugusCount,0);

  const jenjangTotals = useMemo(()=>{
    const t = {};
    kabList.forEach(k => DATA.kab[k].forEach(g => {
      Object.entries(g.c).forEach(([j,n]) => { t[j]=(t[j]||0)+n; });
    }));
    return JENJANG_ORDER.filter(j=>t[j]).map(j=>({name:j, value:t[j]}));
  }, [kabList]);

  const allSchools = useMemo(() => {
    const rows = [];
    kabList.forEach(k => (DATA.kab[k]||[]).forEach(g => (g.schools||[]).forEach(s => {
      const tl = g.tl || {};
      rows.push({
        ...s, kab: k, gugus: g.g, gel: g.gel || null,
        spmiTgl: tl.bimtek_spmi_tgl || null,
        litTgl: tl.bimtek_lit_tgl || null,
        digTgl: tl.bimtek_dig_tgl || null,
      });
    })));
    return rows;
  }, [kabList]);

  const jenjangOptions = useMemo(() => JENJANG_ORDER.filter(j => allSchools.some(s=>s.jenjang===j)), [allSchools]);
  const gelombangOptions = useMemo(() => {
    const set = new Set(allSchools.map(s=>s.gel).filter(Boolean));
    return Array.from(set).sort((a,b) => {
      const na = parseInt((a.match(/\d+/)||[0])[0], 10);
      const nb = parseInt((b.match(/\d+/)||[0])[0], 10);
      return na - nb;
    });
  }, [allSchools]);

  const filteredSchools = useMemo(() => {
    let list = allSchools;
    if (activeKab !== "Semua Kabupaten/Kota") list = list.filter(s => s.kab === activeKab);
    if (activeJenjangs.length > 0) list = list.filter(s => activeJenjangs.includes(s.jenjang));
    if (activeGelombangs.length > 0) list = list.filter(s => activeGelombangs.includes(s.gel));
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      list = list.filter(s => s.npsn.toLowerCase().includes(q));
    }
    const gelNum = (g) => { const m = g && g.match(/\d+/); return m ? parseInt(m[0], 10) : 9999; };
    return [...list].sort((a, b) => {
      const diff = gelNum(a.gel) - gelNum(b.gel);
      if (diff !== 0) return diff;
      return (a.gugus || "").localeCompare(b.gugus || "");
    });
  }, [allSchools, activeKab, activeJenjangs, activeGelombangs, query]);

  const exportExcel = () => {
    const headers = ["NPSN","Nama Sekolah","Gugus Belajar","Gelombang","Jadwal Bimtek Tata Kelola","Jadwal Bimtek Litnum","Jadwal Bimtek Digitalisasi","Kecamatan","Penerima PID"];
    const rows = filteredSchools.map(s => [s.npsn, s.nama, s.gugus, s.gel||"", s.spmiTgl||"", s.litTgl||"", s.digTgl||"", s.kec, s.pid?"Ya":"Tidak"]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    ws["!cols"] = [ {wch:12},{wch:36},{wch:26},{wch:12},{wch:16},{wch:16},{wch:20},{wch:20},{wch:14} ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Sebaran Gugus");
    XLSX.writeFile(wb, "sebaran_gugus_bosp_" + new Date().toISOString().slice(0,10) + ".xlsx");
  };

  return (
    <div>
      <SectionLabel eyebrow={"Peta Sebaran · " + grandTotalSchools + " Satdik"} title="Sebaran Gugus Belajar & Data Sekolah" sub="Kab/Kota, gugus belajar, dan komposisi jenjang penerima BOSP Kinerja Terbaik 2026 di seluruh Nusa Tenggara Barat." />

      <div style={{display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap: 14, marginBottom: 28}}>
        {[
          {label:"Total Satdik Penerima", value: grandTotalSchools, icon: School, tone:"rust"},
          {label:"Total Gugus Belajar", value: grandTotalGugus, icon: Layers, tone:"teal"},
          {label:"Kabupaten/Kota", value: kabList.length, icon: MapPin, tone:"gold"},
          {label:"Jenjang Terlibat", value: jenjangTotals.length, icon: GraduationCap, tone:"default"},
        ].map((s,i)=>(
          <div key={i} style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, padding:"16px 18px", position:"relative", overflow:"hidden"}}>
            <div style={{position:"absolute", top:-14, right:-14, opacity:0.07}}><s.icon size={72} /></div>
            <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e"}}>{s.label}</div>
            <div style={{fontFamily:"'Fraunces', serif", fontSize:34, fontWeight:600, color: INK, marginTop:4}}>{s.value}</div>
          </div>
        ))}
      </div>

      <div style={{display:"grid", gridTemplateColumns:"1.3fr 1fr", gap: 20, marginBottom: 28}}>
        <div style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, padding:20}}>
          <div style={{fontSize:13, fontWeight:700, color: INK, marginBottom:14}}>Jumlah Satdik per Kabupaten/Kota</div>
          <SimpleBarChart data={kabTotals} activeKab={activeKab} onBarClick={k=>setActiveKab(k)} />
        </div>
        <div style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, padding:20}}>
          <div style={{fontSize:13, fontWeight:700, color: INK, marginBottom:14}}>Komposisi Jenjang (Provinsi)</div>
          <SimplePieChart data={jenjangTotals} />
        </div>
      </div>

      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1.2fr", gap:14, marginBottom:16, alignItems:"end"}}>
        <div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e", marginBottom:6}}>Kabupaten/Kota</div>
          <select value={activeKab} onChange={e=>setActiveKab(e.target.value)} style={selectStyle}>
            <option value="Semua Kabupaten/Kota">Semua Kabupaten/Kota</option>
            {kabList.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e", marginBottom:6}}>Jenjang</div>
          <MultiSelect options={jenjangOptions} selected={activeJenjangs} onChange={setActiveJenjangs} placeholder="Semua Jenjang" />
        </div>
        <div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e", marginBottom:6}}>Gelombang</div>
          <MultiSelect options={gelombangOptions} selected={activeGelombangs} onChange={setActiveGelombangs} placeholder="Semua Gelombang" />
        </div>
        <div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e", marginBottom:6}}>Cari NPSN</div>
          <div style={{position:"relative"}}>
            <Search size={14} style={{position:"absolute", left:10, top:11, color:"#9b8f7c"}} />
            <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Masukkan NPSN sekolah..."
              style={{...selectStyle, padding:"9px 12px 9px 30px"}} />
          </div>
        </div>
      </div>

      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10}}>
        <div style={{fontSize:12, color:"#8a7f6e"}}>{filteredSchools.length} satuan pendidikan ditemukan</div>
        <button onClick={exportExcel}
          style={{display:"inline-flex", alignItems:"center", gap:6, background:"#fff", border:"1px solid " + LINE, borderRadius:8, padding:"7px 12px", fontSize:12, fontWeight:600, color: INK, cursor:"pointer"}}>
          <Upload size={13} style={{transform:"rotate(180deg)"}} /> Export Tabel (Excel)
        </button>
      </div>

      <div style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, overflow:"hidden"}}>
        <div style={{maxHeight: 560, overflowY:"auto"}}>
          <table style={{width:"100%", borderCollapse:"collapse", fontSize: 13}}>

            <thead>
              <tr style={{position:"sticky", top:0, background: PAPER2, zIndex:1}}>
                <th style={th}>NPSN</th>
                <th style={th}>Nama Sekolah</th>
                <th style={th}>Gugus Belajar</th>
                <th style={th}>Gelombang</th>
                <th style={th}>Jadwal Bimtek Tata Kelola</th>
                <th style={th}>Jadwal Bimtek Litnum</th>
                <th style={th}>Jadwal Bimtek Digitalisasi</th>
                <th style={th}>Kecamatan</th>
                <th style={th}>Penerima PID</th>
              </tr>
            </thead>
            <tbody>
              {filteredSchools.map((s, i) => (
                <tr key={s.kab+s.gugus+s.npsn+i} style={{background: i%2? "#fbf8f1":"#fff"}}>
                  <td style={td}>{s.npsn}</td>
                  <td style={{...td, fontWeight:600}}>{s.nama}</td>
                  <td style={td}>{s.gugus}</td>
                  <td style={td}>{s.gel || <span style={{color:"#a89e8c"}}>—</span>}</td>
                  <td style={td}>{s.spmiTgl || <span style={{color:"#a89e8c"}}>—</span>}</td>
                  <td style={td}>{s.litTgl || <span style={{color:"#a89e8c"}}>—</span>}</td>
                  <td style={td}>{s.digTgl || <span style={{color:"#a89e8c"}}>—</span>}</td>
                  <td style={td}>{s.kec}</td>
                  <td style={td}>{s.pid ? <Chip tone="teal">Ya</Chip> : <Chip>Tidak</Chip>}</td>

              ))}

}

/* ---------------- PAGE 2: JADWAL & FASDA ---------------- */
function Page2() {
  const kabList = Object.keys(DATA.kab).sort();
  const [activeKab, setActiveKab] = useState("Semua Kabupaten/Kota");
  const [activeJenjangs, setActiveJenjangs] = useState([]);
  const [expanded, setExpanded] = useState(() => new Set());

  const jenjangOptions = useMemo(() => {
    const set = new Set();
    kabList.forEach(k => (DATA.kab[k]||[]).forEach(g => Object.keys(g.c||{}).forEach(j => set.add(j))));
    return JENJANG_ORDER.filter(j => set.has(j));
  }, [kabList]);

  const naVal = (v) => v || <span style={{color:"#a89e8c"}}>Belum ditentukan</span>;
  const naDate = (v) => v || <span style={{color:"#a89e8c"}}>Belum terjadwal</span>;

  const filteredGugus = useMemo(() => {
    const kabs = activeKab === "Semua Kabupaten/Kota" ? kabList : [activeKab];
    const rows = [];
    kabs.forEach(k => (DATA.kab[k]||[]).forEach(g => {
      if (activeJenjangs.length > 0 && !Object.keys(g.c||{}).some(j => activeJenjangs.includes(j))) return;
      rows.push({ kab: k, g });
    }));
    return rows;
  }, [activeKab, activeJenjangs, kabList]);

  const gelombangGroups = useMemo(() => {
    const map = {};
    filteredGugus.forEach(row => {
      const key = row.g.gel || "Belum Terjadwal";
      map[key] = map[key] || [];
      map[key].push(row);
    });
    const keys = Object.keys(map);
    keys.sort((a, b) => {
      const na = a==="Belum Terjadwal" ? 9999 : parseInt((a.match(/\d+/)||[0])[0], 10);
      const nb = b==="Belum Terjadwal" ? 9999 : parseInt((b.match(/\d+/)||[0])[0], 10);
      return na - nb;
    });
    return keys.map(k => ({ gel: k, rows: map[k].sort((a,b)=> a.kab.localeCompare(b.kab) || a.g.g.localeCompare(b.g.g)) }));
  }, [filteredGugus]);

  const toggle = (key) => {
    setExpanded(prev => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key); else next.add(key);
      return next;
    });

  return (
    <div>
      <SectionLabel eyebrow={gelombangGroups.length + " Gelombang · Agustus–September 2026"} title="Jadwal & Fasda per Gelombang" sub="Pilih kabupaten/kota dan jenjang untuk melihat gugus belajar yang terjadwal pada tiap gelombang, lengkap dengan anggota gugus dan fasilitator daerah (Fasda)." />

                    return (

                              style={{display:"inline-flex", alignItems:"center", gap:4, background: isOpen?PAPER2:"transparent", border:"1px solid "+LINE, borderRadius:7, padding:"5px 9px", fontSize:11.5, fontWeight:600, color: INK, cursor:"pointer"}}>

                          </td>
                        </tr>
                        {isOpen && (
                          <tr>

/* ---------------- PAGE 3: DAFTAR FASDA ---------------- */
function Page4() {

  const naVal = (v) => v || <span style={{color:"#a89e8c"}}>—</span>;

  const rows = useMemo(() => {
    const out = [];
    kabList.forEach(k => (DATA.kab[k]||[]).forEach(g => {
      const tl = g.tl || {};

        { label: "Bimtek Tata Kelola", peny: tl.bimtek_spmi_peny, tgl: tl.bimtek_spmi_tgl, fasda: tl.bimtek_spmi_fasda, tone:"rust" },
        { label: "Bimtek Litnum", peny: tl.bimtek_lit_peny, tgl: tl.bimtek_lit_tgl, fasda: tl.bimtek_lit_fasda, tone:"teal" },
        { label: "Bimtek Digitalisasi", peny: tl.bimtek_dig_peny, tgl: tl.bimtek_dig_tgl, fasda: tl.bimtek_dig_fasda, tone:"gold" },
        { label: "Implementasi Tata Kelola", peny: tl.impl_spmi_peny, tgl: tl.impl_spmi_tgl, fasda: tl.impl_spmi_fasda, tone:"rust" },
        { label: "Implementasi Litnum", peny: tl.impl_lit_peny, tgl: tl.impl_lit_tgl, fasda: tl.impl_lit_fasda, tone:"teal" },

            style={{...selectStyle, padding:"9px 12px 9px 30px"}} />

      <div style={{fontSize:12, color:"#8a7f6e", marginBottom:10}}>{filteredRows.length} penugasan ditemukan</div>

      <div style={{background:"#fff", border:"1px solid " + LINE, borderRadius: 10, overflow:"hidden"}}>

                  <td style={{...td, fontWeight:600}}>{naVal(r.fasda)}</td>

          </table>
        </div>
      </div>
    </div>
  );
}

/* ---------------- PAGE 4 (disembunyikan): PELAKSANAAN & UPLOAD TUGAS ---------------- */
function SchoolUploadForm({kab, gugus, sekolah}) {
  const storageKey = "tugas:" + kab + ":" + gugus.g + ":" + sekolah.npsn;
  const [rtlLink, setRtlLink] = useState("");
  const [bahanLink, setBahanLink] = useState("");
  const [pengirim, setPengirim] = useState("");
  const [saved, setSaved] = useState(null);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(false);
  const [status, setStatus] = useState("");

  useEffect(() => {
    let mounted = true;
    setLoading(true);
    setSaved(null);
    setEditing(false);
    (async () => {
      try {
        const raw = localStorage.getItem(storageKey); const res = raw ? { value: raw } : null;
        if (mounted && res && res.value) setSaved(JSON.parse(res.value));
      } catch (e) { /* belum ada data */ }
      if (mounted) setLoading(false);
    })();
    return () => { mounted = false; };
  }, [storageKey]);

  const submit = async () => {
    if (!rtlLink.trim() || !bahanLink.trim() || !pengirim.trim()) { setStatus("Isi nama pengunggah dan kedua link."); return; }
    setStatus("Menyimpan...");
    try {
      const payload = { pengirim: pengirim.trim(), rtlLink: rtlLink.trim(), bahanLink: bahanLink.trim(), waktu: new Date().toLocaleString("id-ID", { dateStyle:"medium", timeStyle:"short" }) };
      localStorage.setItem(storageKey, JSON.stringify(payload));
      setSaved(payload);
      setEditing(false);
      setStatus("");
      if (APPS_SCRIPT_URL) {
        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              kewenangan: gugus.j === "Dikmen" ? "Provinsi Nusa Tenggara Barat" : kab,
              kabupaten: kab,
              gugus: gugus.g,
              sekolah: sekolah.nama,
              rtlLink: rtlLink.trim(),
              bahanLink: bahanLink.trim(),
              pengirim: pengirim.trim(),
            }),
          });
        } catch (e) { /* sinkronisasi ke sheet gagal, data tetap tersimpan lokal */ }
      }
    } catch (e) {
      setStatus("Gagal menyimpan. Coba lagi.");
    }
  };

  if (loading) return <div style={{fontSize:12, color:"#a89e8c", padding:16}}>Memuat data...</div>;

  return (
    <div style={{border:"1px solid " + LINE, borderRadius:10, padding:"16px", background:"#fff"}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, flexWrap:"wrap", marginBottom:12}}>
        <div>
          <div style={{fontSize:14, fontWeight:700, color: INK}}>{sekolah.nama}</div>
          <div style={{fontSize:11.5, color:"#8a7f6e", marginTop:2}}>NPSN {sekolah.npsn} · {sekolah.kec} · Penyelenggara: satuan pendidikan</div>
        </div>
        {saved && !editing && <Chip tone="teal"><CheckCircle2 size={11} style={{verticalAlign:-2, marginRight:3}}/>Sudah mengunggah</Chip>}
        {!saved && !editing && <Chip tone="gold"><Clock size={11} style={{verticalAlign:-2, marginRight:3}}/>Belum mengunggah</Chip>}
      </div>

      {saved && !editing && (
        <div style={{background:"#fbf8f1", borderRadius:8, padding:"12px 14px", fontSize:12.5}}>
          <div style={{color: INK, marginBottom:6}}>Diunggah oleh <b>{saved.pengirim}</b> · {saved.waktu}</div>
          <div style={{display:"flex", flexDirection:"column", gap:5}}>
            <a href={saved.rtlLink} target="_blank" rel="noreferrer" style={{color: TEAL, wordBreak:"break-all", display:"inline-flex", alignItems:"center", gap:4}}>
              <LinkIcon size={12}/> Dokumen RTL: {saved.rtlLink}
            </a>
            <a href={saved.bahanLink} target="_blank" rel="noreferrer" style={{color: TEAL, wordBreak:"break-all", display:"inline-flex", alignItems:"center", gap:4}}>
              <LinkIcon size={12}/> Bahan/Hasil RTL: {saved.bahanLink}
            </a>
          </div>
          <div style={{marginTop:10}}>
            <button onClick={()=>{setEditing(true); setPengirim(saved.pengirim); setRtlLink(saved.rtlLink); setBahanLink(saved.bahanLink);}} style={btnGhost}>Perbarui link</button>
          </div>
        </div>
      )}

      {(!saved || editing) && (
        <div style={{display:"flex", flexDirection:"column", gap:8}}>
          <input value={pengirim} onChange={e=>setPengirim(e.target.value)} placeholder="Nama pengunggah (perwakilan satuan pendidikan)" style={inputStyle} />
          <input value={rtlLink} onChange={e=>setRtlLink(e.target.value)} placeholder="Link Dokumen RTL" style={inputStyle} />
          <input value={bahanLink} onChange={e=>setBahanLink(e.target.value)} placeholder="Link Bahan/Hasil dari RTL tersebut" style={inputStyle} />
          <div style={{display:"flex", gap:8, alignItems:"center"}}>
            <button onClick={submit} style={btnPrimary}><Upload size={12} style={{verticalAlign:-2, marginRight:5}}/>Kirim</button>
            {editing && <button onClick={()=>setEditing(false)} style={btnGhost}>Batal</button>}
            {status && <span style={{fontSize:11.5, color: (status.indexOf("Gagal")>=0||status.indexOf("Isi")>=0) ? RUST : "#8a7f6e"}}>{status}</span>}
          </div>
        </div>
      )}
    </div>
  );
}

const inputStyle = { padding:"9px 12px", borderRadius:8, border:"1px solid " + LINE, fontSize:12.5, outline:"none", width:"100%", boxSizing:"border-box" };
const btnPrimary = { background: RUST, color:"#fff", border:"none", borderRadius:8, padding:"9px 16px", fontSize:12.5, fontWeight:600, cursor:"pointer" };
const btnGhost = { background:"transparent", color:"#6b6154", border:"1px solid " + LINE, borderRadius:8, padding:"8px 13px", fontSize:12, fontWeight:600, cursor:"pointer" };

function Page3() {
  const kabList = Object.keys(DATA.kab).sort();
  const [activeKab, setActiveKab] = useState(kabList[0]);
  const gugusOptions = useMemo(() => (DATA.kab[activeKab]||[]).filter(g=>g.schools && g.schools.length>0), [activeKab]);
  const [activeGugusName, setActiveGugusName] = useState(gugusOptions[0] ? gugusOptions[0].g : "");
  const activeGugus = gugusOptions.find(g=>g.g===activeGugusName);
  const sekolahOptions = activeGugus ? activeGugus.schools : [];
  const [activeNpsn, setActiveNpsn] = useState(sekolahOptions[0] ? sekolahOptions[0].npsn : "");

  useEffect(() => {
    const opts = (DATA.kab[activeKab]||[]).filter(g=>g.schools && g.schools.length>0);
    setActiveGugusName(opts[0] ? opts[0].g : "");
  }, [activeKab]);

  useEffect(() => {
    setActiveNpsn(sekolahOptions[0] ? sekolahOptions[0].npsn : "");
  }, [activeGugusName]);

  const activeSekolah = sekolahOptions.find(s=>s.npsn===activeNpsn);

  return (
    <div>
      <SectionLabel eyebrow="Satuan Pendidikan sebagai Penyelenggara" title="Pelaksanaan RTL per Satuan Pendidikan" sub="Pilih kabupaten/kota, gugus belajar, lalu satuan pendidikan untuk mengunggah link Dokumen RTL dan link Bahan/Hasil dari RTL tersebut." />

      <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:14, marginBottom:22}}>
        <div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e", marginBottom:6}}>Kabupaten/Kota</div>
          <select value={activeKab} onChange={e=>setActiveKab(e.target.value)} style={selectStyle}>
            {kabList.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e", marginBottom:6}}>Gugus Belajar</div>
          <select value={activeGugusName} onChange={e=>setActiveGugusName(e.target.value)} style={selectStyle}>
            {gugusOptions.map(o => <option key={o.g} value={o.g}>{o.g}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", color:"#8a7f6e", marginBottom:6}}>Satuan Pendidikan</div>
          <select value={activeNpsn} onChange={e=>setActiveNpsn(e.target.value)} style={selectStyle}>
            {sekolahOptions.map(s => <option key={s.npsn} value={s.npsn}>{s.nama}</option>)}
          </select>
        </div>
      </div>

      {activeGugus && activeSekolah ? (
        <SchoolUploadForm key={activeKab+activeGugusName+activeNpsn} kab={activeKab} gugus={activeGugus} sekolah={activeSekolah} />
      ) : (
        <div style={{color:"#a89e8c", fontSize:13, padding:20, textAlign:"center", background:"#fff", border:"1px solid " + LINE, borderRadius:10}}>Tidak ada data satuan pendidikan pada pilihan ini.</div>
      )}
    </div>
  );
}

/* ---------------- ROOT ---------------- */
function computeMetaFromData(json) {
  let totalSekolah = 0, totalGugus = 0;
  const kab = (json && json.kab) || {};
  Object.values(kab).forEach(list => { totalGugus += list.length; list.forEach(g => totalSekolah += (g.t||0)); });
  return { totalSekolah, totalGugus, totalKab: Object.keys(kab).length, generatedAt: (json && json.generatedAt) || null };
}

function App() {
  const [page, setPage] = useState(1);
  const [status, setStatus] = useState(APPS_SCRIPT_URL ? "loading" : "ready"); // ready | loading | error
  const [tick, setTick] = useState(0); // dipakai untuk memaksa re-render setelah DATA dimutasi
  const [meta, setMeta] = useState(computeMetaFromData(DATA));

  const loadData = () => {
    if (!APPS_SCRIPT_URL) return;
    setStatus("loading");
    fetch(APPS_SCRIPT_URL)
      .then(r => r.json())
      .then(json => {
        if (!json || !json.kab) throw new Error("Format data tidak sesuai");
        DATA = json;
        setMeta(computeMetaFromData(json));
        setStatus("ready");
        setTick(t => t + 1);
      })
      .catch(() => setStatus("error"));
  };

  useEffect(() => { loadData(); }, []);

  const pages = [
    { id:1, label:"Sebaran Gugus", icon: LayoutGrid },
    { id:2, label:"Jadwal & Fasda", icon: Calendar },
    { id:3, label:"Daftar Fasda", icon: Users },
    // Halaman "Pelaksanaan & Tugas" disembunyikan sementara — komponen Page3 tetap ada di kode,
    // tinggal tambahkan lagi baris { id:4, label:"Pelaksanaan & Tugas", icon: ListChecks } di sini
    // dan {page===4 && <Page3 />} di bagian render untuk mengaktifkannya kembali.
  ];

  return (
    <div style={{minHeight:"100vh", background: PAPER, fontFamily:"'Inter', ui-sans-serif, system-ui", color: INK}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 8px; height:8px; }
        ::-webkit-scrollbar-thumb { background: #d8cdb8; border-radius: 8px; }
        button:focus-visible, input:focus-visible { outline: 2px solid #b5502f; outline-offset: 1px; }
      `}</style>

      <div style={{borderBottom:"1px solid " + LINE, background:"#fbf8f1"}}>
        <div style={{maxWidth: 1180, margin:"0 auto", padding:"22px 28px 0"}}>
          <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap: 12}}>
            <div>
              <div style={{fontSize:11, fontWeight:700, letterSpacing:"0.16em", textTransform:"uppercase", color: RUST}}>BPMP Provinsi Nusa Tenggara Barat</div>
              <h1 style={{fontFamily:"'Fraunces', serif", fontSize:26, fontWeight:600, margin:"4px 0 0"}}>Dasbor BOSP Kinerja Terbaik 2026</h1>
            </div>
            <div style={{display:"flex", gap:16, fontSize:12, color:"#6b6154", alignItems:"center"}}>
              <div><b style={{color:INK}}>{meta.totalSekolah}</b> Satdik</div>
              <div><b style={{color:INK}}>{meta.totalGugus}</b> Gugus</div>
              <div><b style={{color:INK}}>{meta.totalKab}</b> Kab/Kota</div>
              {status === "loading" && <span style={{fontSize:11, color:"#8a7f6e"}}>Memuat…</span>}
              {status === "error" && <span style={{fontSize:11, color: RUST}}>Gagal memuat data terbaru</span>}
              <button onClick={loadData} disabled={status==="loading"} title={APPS_SCRIPT_URL ? "Muat ulang data dari Google Sheets" : "Tempel APPS_SCRIPT_URL di kode untuk mengaktifkan data live"}
                style={{background:"transparent", border:"1px solid " + LINE, borderRadius:7, padding:"5px 10px", fontSize:11.5, fontWeight:600, color:"#6b6154", cursor: status==="loading" ? "default" : "pointer", opacity: status==="loading" ? 0.6 : 1}}>
                ⟳ Segarkan
              </button>
            </div>
          </div>
          <div style={{display:"flex", gap: 4, marginTop: 20}}>
            {pages.map(p => (
              <button key={p.id} onClick={()=>setPage(p.id)}
                style={{
                  display:"flex", alignItems:"center", gap:7,
                  padding:"10px 16px", fontSize:13, fontWeight:600, cursor:"pointer",
                  background:"transparent", border:"none",
                  borderBottom: page===p.id ? "2.5px solid #b5502f" : "2.5px solid transparent",
                  color: page===p.id ? INK : "#8a7f6e",
                }}>
                <p.icon size={15} />
                {p.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{maxWidth: 1180, margin:"0 auto", padding:"28px"}} key={tick}>
        {!DATA.kab ? (
          <div style={{textAlign:"center", padding:"90px 20px", color:"#8a7f6e", fontSize:13.5, lineHeight:1.7}}>
            {!APPS_SCRIPT_URL && <div>Tempel <code>APPS_SCRIPT_URL</code> di dalam kode (lihat <code>README.md</code>) untuk memuat data dari Google Sheets.</div>}
            {APPS_SCRIPT_URL && status==="loading" && <div>Memuat data dari Google Sheets…</div>}
            {APPS_SCRIPT_URL && status==="error" && <div style={{color: RUST}}>Gagal memuat data. Klik tombol "Segarkan" di atas untuk mencoba lagi.</div>}
          </div>
        ) : (
          <Fragment>
            {page===1 && <Page1 />}
            {page===2 && <Page2 />}
            {page===3 && <Page4 />}
            {/* {page===4 && <Page3 />} */}
          </Fragment>
        )}
      </div>

      <div style={{textAlign:"center", fontSize:11, color:"#a89e8c", padding:"18px 0 32px"}}>
        Program BOSP Kinerja Terbaik Tahun 2026 · Kemendikdasmen · {meta.generatedAt ? "Data live dari Google Sheets" : "Data per Agustus 2026"}
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(React.createElement(App));

</script>

<script>
  (function () {
    function showError(title, detail) {
      var rootEl = document.getElementById("root");
      rootEl.innerHTML = '<div id="loading-fallback"><div><b>' + title + '</b><br/><br/>' +
        (detail || "") + '</div></div>';
    }
    try {
      if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
        showError("Gagal memuat komponen dasar (React/Babel).", "Coba muat ulang halaman ini.");
        return;
      }
      var srcEl = document.getElementById("app-source");
      var source = srcEl.textContent;
      var compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]]
      }).code;
      var run = new Function("React", "ReactDOM", "XLSX", "document", "window", "localStorage", compiled);
      run(React, ReactDOM, (typeof XLSX !== "undefined" ? XLSX : undefined), document, window, window.localStorage);
    } catch (err) {
      showError("Terjadi kesalahan saat memuat dasbor.", (err && err.message) ? err.message : String(err));
      if (window.console) console.error(err);
    }
  })();
</script>
</body>
</html>
